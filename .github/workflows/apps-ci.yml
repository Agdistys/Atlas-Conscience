name: Applications — Inspectrice

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'DragonRoute/**'
      - 'server/**'
      - 'APP_*.html'
      - 'tests/**'
      - 'docs/acceptance/**'
      - 'playwright*.config.mjs'
      - 'package*.json'
      - '.github/workflows/*.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: inspectrice-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INSPECTION_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Preview assembly tests
        run: npm run test:preview
      - name: Inspectrice v2
        run: npm run inspect
      - name: Build interactive preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
        run: npm run preview:build
      - name: Test interactive preview
        if: github.event_name == 'pull_request'
        run: npx playwright test --config=playwright.preview.config.mjs
      - name: Archive interactive preview
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: inspectrice-preview
          path: preview-site/
          if-no-files-found: error
          retention-days: 14

      - name: Publish inspection summary even after failure
        if: always()
        run: node tests/inspection-report.mjs
      - name: Archive inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspectrice-v2
          path: |
            quality/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  pages-dry-run:
    name: Pages assembly without publication
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: public-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./public-source
          destination: ./built-site
          build_revision: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Prepare writable publication copy
        run: cp -R built-site site
      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: inspectrice-preview
          path: incoming
      - name: Assemble preview beside unchanged public content
        env:
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.mkdirSync("cache"); const pr = Number(process.env.PREVIEW_PR) || null; fs.writeFileSync("pages-plan.json", JSON.stringify({pr, commit: process.env.PREVIEW_COMMIT, openPRs: pr ? [pr] : []}));'
          node tests/pages/preview.mjs assemble
      - name: Archive assembled site for review
        uses: actions/upload-artifact@v4
        with:
          name: pages-assemblage
          path: site/
          retention-days: 7
